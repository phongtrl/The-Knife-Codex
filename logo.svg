<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="The Knife Codex logo — ensō with ナイフ">
  <!-- ensō brush ring, open at the lower-left -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#2b2823" stroke-width="6.5"
          stroke-linecap="round" stroke-dasharray="181 26" transform="rotate(118 50 50)"/>
  <!-- ink splatter near the opening -->
  <circle cx="29.5" cy="77" r="1.7" fill="#2b2823"/>
  <circle cx="25.5" cy="71.5" r="1" fill="#2b2823"/>
  <!-- ナイフ (knife) -->
  <text x="50" y="57.5" text-anchor="middle"
        font-family="'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif"
        font-size="20" font-weight="700" fill="#2b2823">ナイフ</text>
  <!-- red hanko seal -->
  <rect x="70" y="69" width="17" height="17" rx="2.5" fill="#c0392b"/>
  <text x="78.5" y="82" text-anchor="middle"
        font-family="'Zen Maru Gothic','Zen Kaku Gothic New',serif"
        font-size="11.5" font-weight="700" fill="#f4f1ea">刃</text>
</svg>
